name: Performance baselines
on:
  pull_request:
  workflow_dispatch:
jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: astral-sh/setup-uv@v6
      - name: Go runtime and allocation results
        run: go test -run '^$' -bench 'Benchmark(Euclidean|ExactNeighborWorkers|CorpusEndToEnd)' -benchmem -count 5 ./... | tee go.bench
      - name: densMAP runtime and allocation overhead
        run: go test -run '^$' -bench BenchmarkDensityOverhead -benchmem -count 5 . | tee density.bench
      - name: Go peak RSS
        run: go run ./cmd/peakrss --output go-rss.json -- go test -run '^$' -bench BenchmarkExactNeighborWorkers -benchtime 3x .
      - name: Pinned Python reference
        run: uv run --project parity --locked python benchmarks/python_reference.py --suite fast --repeats 5 --output python-bench.jsonl
      - name: Matched Go end-to-end benchmark
        run: go run ./cmd/umap-benchmark --repeats 5 --output go-umap-bench.jsonl
      - name: Matched Python end-to-end benchmark
        run: uv run --project parity --locked python benchmarks/python_reference.py --suite matched --repeats 5 --output python-umap-bench.jsonl
      - name: Validate and compare matched results
        run: uv run --project parity --locked python benchmarks/compare.py --go go-umap-bench.jsonl --python python-umap-bench.jsonl --output umap-comparison.json | tee umap-comparison.md
      - name: Enforce stable microbench allocation budget
        run: go test -run TestHotPathAllocationGate -count 10 ./...
      - uses: actions/upload-artifact@v4
        with:
          name: performance-${{ github.sha }}
          path: |
            go.bench
            density.bench
            go-rss.json
            python-bench.jsonl
            go-umap-bench.jsonl
            python-umap-bench.jsonl
            umap-comparison.json
            umap-comparison.md
          retention-days: 90
